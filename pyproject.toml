[project]
name = "agent"
version = "0.1.0"
description = "Retail Analysis Assistant: a LangGraph agent that answers leadership's sales questions on BigQuery, safely."
authors = [
    { name = "Yishai Stern" }
]
requires-python = ">=3.12"
# The core needs only langchain-core, langgraph and pydantic. Adapter SDKs
# (google-cloud-bigquery, langchain-google-genai, sqlglot, ...) are added by the slice that
# builds each adapter, and ruff's banned-api keeps them inside agent.adapters (ADR 0006).
dependencies = [
    "google-cloud-bigquery>=3.47.0",
    "langchain-core>=1.0",
    "langchain-google-genai>=4.5.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0.3",
    "sqlglot>=30.31.0",
    "tenacity>=9.1",
]

[project.optional-dependencies]
# The optional web channel (ADR 0010). `uv sync --extra web`.
web = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.scripts]
agent = "agent.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=8.3",
    "pyyaml>=6.0.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Ship the DDL and the ER diagram with the package, so adapters can load them.
source-include = ["src/agent/db/*.sql", "src/agent/db/*.md"]

[tool.ruff]
line-length = 100
# The assignment text as given; ruff would reformat its code examples.
extend-exclude = ["ASSIGNMENT.md"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# ADR 0006: provider SDKs only inside adapters.
"google.cloud".msg = "Import provider SDKs only in agent.adapters.*"
"google.genai".msg = "Import provider SDKs only in agent.adapters.*"
"langchain_google_genai".msg = "Import provider SDKs only in agent.adapters.*"
"langgraph.checkpoint.sqlite".msg = "Import provider SDKs only in agent.adapters.*"
"sqlglot".msg = "Import provider SDKs only in agent.adapters.*"
"yaml".msg = "Import provider SDKs only in agent.adapters.*"
"agent.adapters".msg = "Only agent.composition names concrete adapters; take a port instead"

[tool.ruff.lint.per-file-ignores]
# Adapters hold the SDKs; composition wires adapters to ports; tests build both directly.
"src/agent/adapters/**" = ["TID251"]
"src/agent/composition.py" = ["TID251"]
"tests/**" = ["TID251"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
